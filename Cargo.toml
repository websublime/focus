[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/websublime/focus"
publish = false

[workspace.dependencies]
gethostname = "1"
getrandom = "0.3"
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
regress = "0.12"
same-file = "1"
sha2 = "0.10"
flate2 = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
focus-js = { path = "crates/focus-js" }
focus-frontmatter = { path = "crates/focus-frontmatter" }
focus-harness = { path = "crates/focus-harness" }
focus-graph = { path = "crates/focus-graph" }
focus-audit = { path = "crates/focus-audit" }
focus-markdown = { path = "crates/focus-markdown" }
focus-state = { path = "crates/focus-state" }
focus-evidence = { path = "crates/focus-evidence" }
focus-log = { path = "crates/focus-log" }
focus-guards = { path = "crates/focus-guards" }
focus-intent = { path = "crates/focus-intent" }
focus-lifecycle = { path = "crates/focus-lifecycle" }
focus-hooks = { path = "crates/focus-hooks" }
focus-workspace = { path = "crates/focus-workspace" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile `dist` builds release artifacts with.
[profile.dist]
inherits = "release"
lto = "thin"
