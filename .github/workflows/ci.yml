name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

# The toolchain is the one rust-toolchain.toml pins; rustup installs it on the
# first cargo call. Each step repeats the lines that explain a failure as
# annotations, so a failure can be read from the run's summary without opening
# its log.
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: |
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '(^| )(error|warning)(\[|:)' lint.log | head -9 | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit "$status"
      # Needs neither Bun nor an upstream checkout: the parity fixtures are
      # vendored. The recorded differential replays on Linux and macOS only
      # (see crates/focus-cli/tests/recorded.rs).
      - name: Test
        run: |
          cargo test --workspace 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^test .* FAILED$|panicked at|^error(\[|:)|^  (left|right):|^assertion ' test.log | head -9 | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit "$status"

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install || rustup show
      - run: cargo fmt --all --check

  # The oldest toolchain the workspace claims to build with (rust-version).
  # RUSTUP_TOOLCHAIN outranks rust-toolchain.toml.
  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.89"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.89 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
